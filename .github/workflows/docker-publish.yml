name: Docker Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/chechout@v6
      - name: Log in to the Conteiner registry
        uses: actions/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.author }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        run: |
          docker build . --tag ghcr.io/yashiami/skills-publish-docker-images/stackoverflown:main
          docker push ghcr.io/yashiami/skills-publish-docker-images/stackoverflown:main